<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<button onclick="Toast()">Click Me</button>
    <script ">

        function Toast(){
            let message = prompt("Yeh! Dude, How are you doing today?")
            if (message === "yes"){
                alert("I am fine thanks!!")
            } else if(message === "no"){
                alert("Yeeeeeeeeeee, What happened!!")
            } else{
                alert("Sorry may god deliver you")
            }
        }
    </script>
</body>
</html>
